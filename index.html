  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Heebo', sans-serif;
      background: #f7f4ef;
      color: #171F35;
    }

    /* ── Grid bg ── */
    .grid-bg {
      background-color: #f7f4ef;
      background-image:
        linear-gradient(rgba(180,160,130,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,160,130,0.06) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── Progress bar ── */
    .progress-fill { transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }

    /* ── Screen transition ── */
    .screen { animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }

    /* ── Cards (value prop, sections) ── */
    .card {
      background: #ffffff;
      border: 1px solid #e8e2d8;
      border-radius: 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
    }

    /* ── Option cards ── */
    .option-card {
      background: #ffffff;
      border: 1.5px solid #e3ddd3;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .option-card:hover:not(.selected) {
      border-color: rgba(166,124,0,0.45);
      background: #fffaeb;
      transform: scale(1.012);
      box-shadow: 0 4px 16px rgba(166,124,0,0.12);
    }
    .option-card.selected {
      border-color: #a67c00 !important;
      background: linear-gradient(135deg, #fdf6e0 0%, #fffaf0 100%) !important;
      transform: scale(1.016);
      box-shadow: 0 4px 20px rgba(166,124,0,0.18);
    }
    .option-card.selected .option-letter {
      background: linear-gradient(135deg, #E8CD85, #C9A24A);
      color: #171F35;
      border-color: transparent;
    }

    /* ── Inputs ── */
    .heb-input {
      background: #ffffff;
      border: 1.5px solid #d6d0c6;
      color: #171F35;
      border-radius: 12px;
      padding: 13px 16px;
      font-family: 'Heebo', sans-serif;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      direction: rtl;
      text-align: right;
    }
    .heb-input::placeholder { color: #b0a898; }
    .heb-input:focus {
      border-color: #a67c00;
      box-shadow: 0 0 0 3px rgba(166,124,0,0.14);
    }
    .heb-input.error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }

    /* ── CTA button ── */
    .cta-btn {
      background: linear-gradient(135deg, #E8CD85 0%, #C9A24A 100%);
      color: #171F35;
      font-family: 'Heebo', sans-serif;
      font-weight: 700;
      font-size: 16px;
      padding: 15px 34px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 6px 20px rgba(27,42,74,0.18), 0 2px 6px rgba(168,132,47,0.20);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
      display: inline-block;
      text-decoration: none;
    }
    .cta-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .cta-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 28px rgba(27,42,74,0.24), 0 4px 10px rgba(168,132,47,0.26); }
    .cta-btn:hover::before { opacity: 1; }
    .cta-btn:active { transform: scale(0.99); }
    .cta-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none; }

    /* ── Back button ── */
    .back-btn {
      background: rgba(23,31,53,0.06);
      border: 1.5px solid rgba(23,31,53,0.1);
      color: rgba(23,31,53,0.55);
      font-family: 'Heebo', sans-serif;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-btn:hover { background: rgba(23,31,53,0.1); color: #171F35; }

    /* ── Icon container ── */
    .icon-wrap {
      background: linear-gradient(135deg, rgba(232,205,133,0.22) 0%, rgba(201,162,74,0.10) 100%);
      border: 1px solid rgba(201,162,74,0.3);
      box-shadow: 0 6px 28px rgba(201,162,74,0.16), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* ── Gradient text ── */
    .gradient-text {
      background: linear-gradient(135deg, #a67c00 0%, #C9A24A 55%, #a67c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(23,31,53,0.12); border-radius: 4px; }

    /* ── Loading dots ── */
    .dot { animation: pulseSoft 1.4s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.22s; }
    .dot:nth-child(3) { animation-delay: 0.44s; }

    /* ── Label secondary ── */
    .label-main  { color: rgba(23,31,53,0.5);  font-size:14px; font-weight:600; }
    .label-sub   { color: rgba(23,31,53,0.3);  font-size:12px; }
    .text-body   { color: rgba(23,31,53,0.74); }
    .text-muted  { color: rgba(23,31,53,0.35); }
    .screen ol li::marker { color:#A8842F; font-weight:800; }
  </style>

  /* ═══ SCORING ═══ */
  function calcScores() {
    let M=0,H=0,R=0;
    QUESTIONS.forEach((q,i) => {
      const p = state.answers[i] ?? 0;
      if (q.bucket==='M') M+=p; else if (q.bucket==='H') H+=p; else R+=p;
    });
    return {M,H,R};
  }
  /* each type's raw score / its max (questions x 2). Shared by determineProfile and the result bars. */
  function normScores(s) {
    const cnt = {};
    QUESTIONS.forEach(q => { cnt[q.bucket] = (cnt[q.bucket]||0)+1; });
    const n = {};
    ['M','H','R'].forEach(k => { n[k] = cnt[k] ? (Number(s && s[k])||0) / (cnt[k]*2) : 0; });
    return n;
  }
  /* highest normalised score wins. Tie (within 1e-9): fixed order M, R, H. */
  function determineProfile(s) {
    const n = normScores(s);
    let best = 'M';
    ['R','H'].forEach(k => { if (n[k] > n[best] + 1e-9) best = k; });
    return best;
  }

  /* her mix of the three patterns, from state.scores.
     Same normalisation as determineProfile (normScores: raw / max per type), then scaled to 100%.
     determineProfile picks the highest normalised type, so her bar is always the top one. */
  const MIX_NAMES = { R:'הרומנטיקנית', M:'הממקסמת', H:'המהססת' };
  /* [[type, pct], ...] her type first, sums to 100. Used by the page bars AND the day-0 email bars. */
  function scorePct(scores, profile) {
    const raw = normScores(scores || {});
    const sum = raw.R + raw.M + raw.H;
    const pct = {}; ['R','M','H'].forEach(k => { pct[k] = sum ? Math.round(raw[k]*100/sum) : 33; });
    const me = profile || determineProfile(scores || {});
    const diff = 100 - (pct.R + pct.M + pct.H);
    if (diff >= 0) pct[me] += diff;                       /* rounding remainder goes to her type */
    else { const lo = ['R','M','H'].filter(k => k !== me).sort((a,b) => pct[a]-pct[b])[0]; pct[lo] += diff; }
    const order = [me].concat(['R','M','H'].filter(k => k !== me).sort((a,b) => pct[b]-pct[a]));
    return order.map(k => [k, pct[k]]);
  }
  function scoreBars() {
    const NAMES = MIX_NAMES;
    const me = state.profile || determineProfile(state.scores || {});
    const rows = scorePct(state.scores || {}, me); const pct = {}; rows.forEach(([k, v]) => { pct[k] = v; });
    return rows.map(([k]) => {
      const mine = k === me;
      return `<div class="mb-3">
        <div class="flex justify-between text-base mb-1" style="${mine ? 'color:#171F35;font-weight:800' : 'color:rgba(23,31,53,0.74)'}"><span>${NAMES[k]}</span><span>${pct[k]}%</span></div>
        <div style="height:10px;border-radius:6px;background:rgba(23,31,53,0.07);overflow:hidden"><div class="score-fill" data-k="${k}" data-pct="${pct[k]}" style="height:100%;width:${pct[k]}%;border-radius:6px;background:${mine ? 'linear-gradient(90deg,#E2C374,#C9A24A)' : 'rgba(23,31,53,0.22)'}"></div></div>
      </div>`;
    }).join('');
  }

    const FOOT = `margin:2em 0 0;padding-top:12px;border-top:1px solid #ececec;${FONT};color:#6b6b70;font-size:13px;line-height:1.5;direction:rtl;text-align:center`;

    const li = items => items.map(x => `<li style="${LI}">${x}</li>`).join('\n');

    /* her mix: same numbers + order as the page bars (scorePct), email-safe tables */
    const bars = scorePct(scores || {}, prof).map(([k, pct]) => {
      const mine = k === prof;
      const fill = mine ? '#C9A24A' : '#E3D2A2';
      const w = Math.max(0, Math.min(100, pct));
      const fillTd = w > 0 ? `<td width="${w}%" bgcolor="${fill}" style="width:${w}%;background-color:${fill};height:10px;font-size:0;line-height:0">&nbsp;</td>` : '';
      const restTd = w < 100 ? `<td bgcolor="#ECEEF2" style="background-color:#ECEEF2;height:10px;font-size:0;line-height:0">&nbsp;</td>` : '';
      return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="rtl" style="border-collapse:collapse;margin:0 0 4px"><tr>
<td style="${FONT};font-size:16px;line-height:1.4;color:${NAVY};${mine ? 'font-weight:800' : 'font-weight:400'};text-align:right;direction:rtl">${MIX_NAMES[k]}</td>
<td style="${FONT};font-size:16px;line-height:1.4;color:${NAVY};${mine ? 'font-weight:800' : 'font-weight:400'};text-align:left;direction:ltr">${pct}%</td>
</tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="rtl" style="border-collapse:separate;border-radius:6px;overflow:hidden;margin:0 0 14px;background-color:#ECEEF2"><tr>${fillTd}${restTd}</tr></table>`;
    }).join('\n');

    const series = consent
      ? `<p style="${P}">ובכל מקרה, גם אם עוד לא החלטת: בימים הקרובים אשלח לך עוד כמה מיילים קצרים, בערך אחד כל יומיים, עם תרגיל קטן בכל אחד, והראשון כבר בעוד יומיים.</p>\n`
      : '';
    const addr = SENDER_ADDRESS ? `<br><span style="white-space:nowrap">${escHtml(SENDER_ADDRESS).replace(' 16', '&nbsp;16')}</span>` : '';

    return `<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>@media only screen { .email * { word-break: break-word; } }</style>
</head>
<body style="margin:0;padding:0;background-color:#FFFFFF;-webkit-font-smoothing:antialiased;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#FFFFFF;opacity:0;">הדפוס הבולט שלך: ${r.tag}&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;</div>
<div class="email" dir="rtl" style="margin-right:15px;margin-left:15px;direction:rtl;text-align:right">
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:separate;mso-table-lspace:0pt;mso-table-rspace:0pt;width:100%;max-width:560px;margin:0 auto"><tbody><tr><td style="vertical-align:top">
<div style="text-align:center;margin:8px 0 6px;"><img src="https://liorochman.com/assets/logo-email.png" alt="ליאור רוכמן אימון מנטלי" width="88" height="64" style="display:inline-block;width:88px;height:64px;border:0;"></div>

<p style="${P};margin-top:1em">היי${firstName ? ' ' + escHtml(firstName) : ''},</p>

<p style="margin:1.4em 0 0.3em;${BASE};color:${GOLD};font-weight:700;text-align:center">${L.label}:</p>
<p style="margin:0 0 0.4em;${FONT};font-size:32px;line-height:1.2;font-weight:900;color:${NAVY};direction:rtl;text-align:center">${r.tag}</p>
<p style="${CENTER}">${r.mirror}</p>

<p style="${H}">${VARIANT.headline}</p>
<p style="${P}">${L.patternLine(r.tag)}</p>

<p style="${H}">${L.recogTitle}</p>
<ul style="${LIST}">
${li(r.moments)}
</ul>
<p style="${P}">${L.notYou(r.others)}</p>

<p style="${P}">${r.why}</p>
<p style="${PB}">${r.noBlame}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:separate;margin:1.6em 0 0;${CARD}"><tr><td style="padding:18px 18px 6px;direction:rtl;text-align:right">
<p style="margin:0 0 14px;${FONT};color:${NAVY};font-size:20px;font-weight:800;line-height:1.35;direction:rtl;text-align:right">${L.mixTitle}</p>
${bars}
</td></tr></table>

<p style="${H}">${L.tipsTitle(r.tag)}</p>
<ol style="${LIST}">
${li(r.tips)}
</ol>
<p style="${H3}">${L.weekTitle}</p>
<p style="${P}">${r.week}</p>
<p style="${P}">${r.weekMore}</p>

<p style="${H};margin-top:2.2em">${L.bridgeTitle}</p>
<p style="${P}">${L.bridgeText}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:separate;margin:1.2em 0 0;${CARD}"><tr><td style="padding:20px 18px 8px;direction:rtl;text-align:right">
<p style="margin:0 0 4px;${FONT};color:${NAVY};font-size:20px;font-weight:800;line-height:1.35;direction:rtl;text-align:right">${C.title}</p>
<p style="${P}">${C.sub}</p>
<ol style="${LIST}">
${li(C.steps)}
</ol>
<table cellpadding="0" cellspacing="0" style="margin:16px auto 12px;border-collapse:separate"><tbody><tr><td align="center" bgcolor="#E2C374" style="border-radius:14px;background-color:#E2C374;text-align:center;mso-padding-alt:15px 34px">
<a href="${BOOK_URL}" style="display:inline-block;padding:15px 34px;color:#1B2A4A;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;font-size:16px;font-weight:700;line-height:1.5;text-decoration:none;border-radius:14px">${C.button}</a>
</td></tr></tbody></table>
</td></tr></table>
<p style="${CENTER};margin-top:0.8em">${L.howto}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:separate;margin:1.6em 0 1.4em;${CARD}"><tr><td style="padding:16px 18px;direction:rtl;text-align:right">
<p style="margin:0 0 8px;${BASE};color:${BODY};text-align:right">${hadar.quote}</p>
<p style="margin:0;${BASE};color:${NAVY};text-align:right"><strong>${hadar.name}</strong>, ${hadar.meta}</p>
</td></tr></table>

${series}<p style="${P}">ליאור</p>

<p style="${FOOT}">קיבלת את המייל הזה כי מילאת את שאלון הבליינדספוט וביקשת את התוצאה. ליאור רוכמן, אימון מנטלי לזוגיות, liorochman.com${addr}<br>לא רוצה לקבל ממני מיילים? אפשר לענות למייל הזה במילה "הסרה".</p>

</td></tr></tbody></table>
</div>
</body>
</html>`;
  }

  function sendToZapier(payload) {
    if (!ZAPIER_WEBHOOK || ZAPIER_WEBHOOK.includes('PASTE')) return;
    fetch(ZAPIER_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  }

  function sendToZapierFollowup(payload) {
    fetch(ZAPIER_FOLLOWUP_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      keepalive: true,
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        timestamp:    payload.timestamp,
        name:         payload.name,
        first_name:   (payload.name || '').trim().split(' ')[0],
        email:        payload.email,
        profile:      payload.profile,
        profile_name: payload.profile_name
      })
    }).catch(() => {});
  }

  /* ═══ ACTIONS ═══ */
  function startQuiz() { state.screen='quiz'; state.currentQ=0; render(); }

  let _t=null;
  function selectOption(idx) {
    clearTimeout(_t);
    state.answers[state.currentQ] = OPTIONS[idx].points;
    render();
    _t = setTimeout(nextQuestion, 480);
  }

  function nextQuestion() {
    if (state.answers[state.currentQ]===undefined) return;
    if (state.currentQ < QUESTIONS.length-1) state.currentQ++;
    else state.screen='lead';
    render();
  }

  function goBack() {
    if (state.screen==='lead') { state.screen='quiz'; render(); return; }
    if (state.currentQ>0) state.currentQ--; else state.screen='intro';
    render();
  }

  function submitLead() {
    const email = document.getElementById('emailInput').value.trim();
    const errEl  = document.getElementById('emailError');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('emailInput').classList.add('error');
      errEl.classList.remove('hidden');
      return;
    }
    state.userEmail = email;
    state.userName  = document.getElementById('nameInput').value.trim();
    state.scores    = calcScores();
    state.profile   = determineProfile(state.scores);

    const profileNames = { M:'הממקסם', H:'המהסס', R:'הרומנטיקן' };
    const leadPayload = {
      timestamp:     new Date().toISOString(),
      name:          state.userName,
      email:         state.userEmail,
      profile:       state.profile,
      profile_name:  profileNames[state.profile],
      score_M:       state.scores.M,
      score_H:       state.scores.H,
      score_R:       state.scores.R,
      email_subject: 'הדפוס שלך בדייטים: התוצאה מהשאלון',
      email_html:    buildEmailHtml(state.profile, state.userName, state.scores, true)
    };
    sendToZapier(leadPayload);
    sendToZapierFollowup(leadPayload);
    if (typeof fbq === 'function') {
      fbq('track', 'Lead', { content_name: 'blindspots_quiz', profile: state.profile });
    }

    state.screen = 'loading';
    render();
    setTimeout(() => { state.screen='thankyou'; render(); }, 2400);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
  </script>
</body>
</html>
