  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Heebo', sans-serif;
      background: #f7f4ef;
      color: #1a1612;
    }

    /* ── Grid bg ── */
    .grid-bg {
      background-color: #f7f4ef;
      background-image:
        linear-gradient(rgba(180,160,130,0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,160,130,0.13) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── Progress bar ── */
    .progress-fill { transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }

    /* ── Screen transition ── */
    .screen { animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }

    /* ── Cards (value prop, sections) ── */
    .card {
      background: #ffffff;
      border: 1px solid #e8e2d8;
      border-radius: 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
    }

    /* ── Option cards ── */
    .option-card {
      background: #ffffff;
      border: 1.5px solid #e3ddd3;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .option-card:hover:not(.selected) {
      border-color: rgba(166,124,0,0.45);
      background: #fffaeb;
      transform: scale(1.012);
      box-shadow: 0 4px 16px rgba(166,124,0,0.12);
    }
    .option-card.selected {
      border-color: #a67c00 !important;
      background: linear-gradient(135deg, #fdf6e0 0%, #fffaf0 100%) !important;
      transform: scale(1.016);
      box-shadow: 0 4px 20px rgba(166,124,0,0.18);
    }
    .option-card.selected .option-letter {
      background: linear-gradient(135deg, #ffde59, #e3b023);
      color: #1a1612;
      border-color: transparent;
    }

    /* ── Inputs ── */
    .heb-input {
      background: #ffffff;
      border: 1.5px solid #d6d0c6;
      color: #1a1612;
      border-radius: 12px;
      padding: 13px 16px;
      font-family: 'Heebo', sans-serif;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      direction: rtl;
      text-align: right;
    }
    .heb-input::placeholder { color: #b0a898; }
    .heb-input:focus {
      border-color: #a67c00;
      box-shadow: 0 0 0 3px rgba(166,124,0,0.14);
    }
    .heb-input.error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }

    /* ── CTA button ── */
    .cta-btn {
      background: linear-gradient(135deg, #ffde59 0%, #e3b023 100%);
      color: #1a1612;
      font-family: 'Heebo', sans-serif;
      font-weight: 700;
      font-size: 16px;
      padding: 15px 34px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 6px 24px rgba(166,124,0,0.35), 0 2px 6px rgba(166,124,0,0.18);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
      display: inline-block;
      text-decoration: none;
    }
    .cta-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .cta-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 32px rgba(166,124,0,0.42), 0 4px 10px rgba(166,124,0,0.22); }
    .cta-btn:hover::before { opacity: 1; }
    .cta-btn:active { transform: scale(0.99); }
    .cta-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none; }

    /* ── Back button ── */
    .back-btn {
      background: rgba(26,22,18,0.06);
      border: 1.5px solid rgba(26,22,18,0.1);
      color: rgba(26,22,18,0.55);
      font-family: 'Heebo', sans-serif;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-btn:hover { background: rgba(26,22,18,0.1); color: #1a1612; }

    /* ── Icon container ── */
    .icon-wrap {
      background: linear-gradient(135deg, rgba(255,222,89,0.22) 0%, rgba(227,176,35,0.10) 100%);
      border: 1px solid rgba(227,176,35,0.3);
      box-shadow: 0 6px 28px rgba(227,176,35,0.16), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* ── Gradient text ── */
    .gradient-text {
      background: linear-gradient(135deg, #a67c00 0%, #e3b023 55%, #a67c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(26,22,18,0.12); border-radius: 4px; }

    /* ── Loading dots ── */
    .dot { animation: pulseSoft 1.4s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.22s; }
    .dot:nth-child(3) { animation-delay: 0.44s; }

    /* ── Label secondary ── */
    .label-main  { color: rgba(26,22,18,0.5);  font-size:14px; font-weight:600; }
    .label-sub   { color: rgba(26,22,18,0.3);  font-size:12px; }
    .text-body   { color: rgba(26,22,18,0.62); }
    .text-muted  { color: rgba(26,22,18,0.35); }
  </style>

  /* ═══ SCORING ═══ */
  function calcScores() {
    let M=0,H=0,R=0;
    QUESTIONS.forEach((q,i) => {
      const p = state.answers[i] ?? 0;
      if (q.bucket==='M') M+=p; else if (q.bucket==='H') H+=p; else R+=p;
    });
    return {M,H,R};
  }
  function determineProfile(s) {
    const cnt = {};
    QUESTIONS.forEach(q => { cnt[q.bucket] = (cnt[q.bucket]||0)+1; });
    const pct = { M: s.M/(cnt.M*2), H: s.H/(cnt.H*2), R: s.R/(cnt.R*2) };
    if (pct.H > pct.M && pct.H > pct.R) return 'H';
    if (pct.R > pct.M && pct.R > pct.H) return 'R';
    return 'M';
  }

  function sendToZapier(payload) {
    if (!ZAPIER_WEBHOOK || ZAPIER_WEBHOOK.includes('PASTE')) return;
    fetch(ZAPIER_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  }

  function sendToZapierFollowup(payload) {
    fetch(ZAPIER_FOLLOWUP_WEBHOOK, {
      method: 'POST',
      mode: 'no-cors',
      keepalive: true,
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        timestamp:    payload.timestamp,
        name:         payload.name,
        first_name:   (payload.name || '').trim().split(' ')[0],
        email:        payload.email,
        profile:      payload.profile,
        profile_name: payload.profile_name
      })
    }).catch(() => {});
  }

  /* ═══ ACTIONS ═══ */
  function startQuiz() { state.screen='quiz'; state.currentQ=0; render(); }

  let _t=null;
  function selectOption(idx) {
    clearTimeout(_t);
    state.answers[state.currentQ] = OPTIONS[idx].points;
    render();
    _t = setTimeout(nextQuestion, 480);
  }

  function nextQuestion() {
    if (state.answers[state.currentQ]===undefined) return;
    if (state.currentQ < QUESTIONS.length-1) state.currentQ++;
    else state.screen='lead';
    render();
  }

  function goBack() {
    if (state.screen==='lead') { state.screen='quiz'; render(); return; }
    if (state.currentQ>0) state.currentQ--; else state.screen='intro';
    render();
  }

  function submitLead() {
    const email = document.getElementById('emailInput').value.trim();
    const errEl  = document.getElementById('emailError');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('emailInput').classList.add('error');
      errEl.classList.remove('hidden');
      return;
    }
    state.userEmail = email;
    state.userName  = document.getElementById('nameInput').value.trim();
    state.scores    = calcScores();
    state.profile   = determineProfile(state.scores);

    const profileNames = { M:'הממקסם', H:'המהסס', R:'הרומנטיקן' };
    const leadPayload = {
      timestamp:     new Date().toISOString(),
      name:          state.userName,
      email:         state.userEmail,
      profile:       state.profile,
      profile_name:  profileNames[state.profile],
      score_M:       state.scores.M,
      score_H:       state.scores.H,
      score_R:       state.scores.R,
      email_subject: 'תוצאות השאלון - blindspots בדייטינג',
      email_html:    buildEmailHtml(state.profile, state.userName, state.scores)
    };
    sendToZapier(leadPayload);
    sendToZapierFollowup(leadPayload);
    if (typeof fbq === 'function') {
      fbq('track', 'Lead', { content_name: 'blindspots_quiz', profile: state.profile });
    }

    state.screen = 'loading';
    render();
    setTimeout(() => { state.screen='thankyou'; render(); }, 2400);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
